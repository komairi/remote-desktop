name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-viewer/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Grant execute permission
        run: chmod +x android-viewer/gradlew || true
      - name: Generate gradle wrapper if missing
        working-directory: android-viewer
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.5 || true
          fi
      - name: Build Debug APK
        working-directory: android-viewer
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteViewer-debug
          path: android-viewer/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
